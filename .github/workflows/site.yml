name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Build static website
        working-directory: site
        env:
          VITE_BASE_PATH: /Hanamori/
        run: bun run build
      - name: Check types and tests
        working-directory: site
        run: |
          bun run check
          bun run test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/.output/public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.HANAMORI_PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
