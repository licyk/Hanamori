name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', 'install.ps1', 'install.sh', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'install.ps1', 'install.sh', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Build static website
        working-directory: site
        env:
          VITE_BASE_PATH: /Hanamori/
        run: bun run build
      - name: Check types and tests
        working-directory: site
        run: |
          bun run check
          bun run test
      - name: Configure Git
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_PRI: ${{ secrets.GITEE_RSA_PRIVATE_KEY }}
          GIT_USERNAME: ${{ github.repository_owner }}
          GIT_EMAIL: ${{ github.repository_owner }}@user.github.com
        run: |
          mkdir -p ~/.ssh/
          echo "${DEPLOY_PRI}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global user.name "${GIT_USERNAME}"
          git config --global user.email "${GIT_EMAIL}"
      - name: Commit the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: site/.output/public
        env:
          GIT_URL: git@github.com:${{ github.repository }}.git
        run: |
          git init
          git remote add origin "${GIT_URL}"
          git add -A
          git commit -m "Site auto generated. Time: $(date +'%Y-%m-%d %H:%M:%S')"
      - name: Push the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: site/.output/public
        run: git push origin HEAD:gh-pages --force
