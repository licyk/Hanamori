name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag (blank selects the latest by version)'
        required: false
        type: string
      target:
        description: Where to publish
        type: choice
        default: all
        options: [all, github, crates-io]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'latest' }}
  cancel-in-progress: false

jobs:
  plan:
    name: Select and verify release source
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Select release tag
        id: source
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          Copy-Item .github/scripts/release.ps1 "$env:RUNNER_TEMP/release.ps1"
          & "$env:RUNNER_TEMP/release.ps1" -Stage Resolve -Tag $env:RELEASE_TAG
      - name: Checkout selected source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.source.outputs.commit }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: stable
      - name: Verify tag and Cargo version
        id: verify
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: '& "$env:RUNNER_TEMP/release.ps1" -Stage Verify -Tag $env:RELEASE_TAG'

  checks:
    name: Checks
    needs: plan
    uses: ./.github/workflows/ci.yml
    with:
      source: ${{ needs.plan.outputs.commit }}

  installer-checks:
    name: Installer checks
    needs: plan
    uses: ./.github/workflows/installers.yml
    with:
      source: ${{ needs.plan.outputs.commit }}

  build:
    name: Build (${{ matrix.target }})
    needs: [plan, checks, installer-checks]
    if: github.event_name == 'push' || inputs.target != 'crates-io'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Build release
        run: cargo build --locked --release -p hanamori --bin hanamori --target $env:BUILD_TARGET
      - name: Package binary
        shell: pwsh
        run: ./.github/scripts/release.ps1 -Stage Package -Tag $env:RELEASE_TAG -Target $env:BUILD_TARGET
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hanamori-${{ matrix.target }}
          if-no-files-found: error
          path: |
            hanamori-${{ matrix.target }}.exe
            hanamori-${{ matrix.target }}.zip

  github-release:
    name: Publish GitHub Release
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: hanamori-*-pc-windows-msvc
          merge-multiple: true
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          files: |
            dist/hanamori-x86_64-pc-windows-msvc.exe
            dist/hanamori-x86_64-pc-windows-msvc.zip
            dist/hanamori-aarch64-pc-windows-msvc.exe
            dist/hanamori-aarch64-pc-windows-msvc.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
      - name: Verify published executable digest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Accept = 'application/vnd.github+json'; Authorization = "Bearer $env:GITHUB_TOKEN" }
          $tag = [Uri]::EscapeDataString($env:RELEASE_TAG)
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Headers $headers
          foreach ($target in @('x86_64-pc-windows-msvc', 'aarch64-pc-windows-msvc')) {
            foreach ($extension in @('exe', 'zip')) {
              $name = "hanamori-$target.$extension"
              $asset = @($release.assets | Where-Object { $_.name -ceq $name })
              if ($asset.Count -ne 1) { throw "Missing release asset: $name" }
              $expected = 'sha256:' + (Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($asset[0].digest -cne $expected) { throw "Published digest mismatch: $name" }
            }
          }
          Write-Host "Verified published executable digest for $env:RELEASE_TAG"

  crates-io:
    name: Publish to crates.io
    needs: [plan, checks, installer-checks]
    if: github.event_name == 'push' || inputs.target != 'github'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Publish crate
        shell: pwsh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CARGO_REGISTRY_TOKEN)) {
            throw 'Configure the CARGO_REGISTRY_TOKEN repository secret before publishing.'
          }
          cargo publish --locked --registry crates-io -p hanamori --target x86_64-pc-windows-msvc
