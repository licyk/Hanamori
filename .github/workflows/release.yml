name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to build and release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      commit: ${{ steps.verify.outputs.commit }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          rust-version: stable

      - name: Verify release tag and package identity
        id: verify
        shell: pwsh
        run: ./.github/scripts/release.ps1 -Stage Verify -Tag $env:RELEASE_TAG

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Run tests
        env:
          HANAMORI_REQUIRE_SHELL_TESTS: '1'
        run: cargo test --workspace --locked --release --target x86_64-pc-windows-msvc

      - name: Build release
        run: cargo build --locked --release -p hanamori --bin hanamori --target x86_64-pc-windows-msvc

      - name: Package binary
        shell: pwsh
        run: ./.github/scripts/release.ps1 -Stage Package -Tag $env:RELEASE_TAG

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hanamori-windows
          if-no-files-found: error
          path: |
            hanamori-x86_64-pc-windows-msvc.exe
            hanamori-x86_64-pc-windows-msvc.zip

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: hanamori-windows
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ needs.build.outputs.commit }}
          files: |
            dist/hanamori-x86_64-pc-windows-msvc.exe
            dist/hanamori-x86_64-pc-windows-msvc.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Verify published executable digest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Accept = 'application/vnd.github+json'; Authorization = "Bearer $env:GITHUB_TOKEN" }
          $tag = [Uri]::EscapeDataString($env:RELEASE_TAG)
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/licyk/Hanamori/releases/tags/$tag" -Headers $headers
          $asset = @($release.assets | Where-Object { $_.name -ceq 'hanamori-x86_64-pc-windows-msvc.exe' })
          if ($asset.Count -ne 1) { throw 'The release executable asset is missing.' }
          $expected = 'sha256:' + (Get-FileHash -LiteralPath 'dist/hanamori-x86_64-pc-windows-msvc.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($asset[0].digest -cne $expected) { throw 'The published executable digest does not match the packaged binary.' }
          Write-Host "Verified published executable digest for $env:RELEASE_TAG"
