name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install Zsh for Linux shell integration tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check module architecture
        run: cargo xtask check
      - name: Test library and CLI
        env:
          HANAMORI_REQUIRE_SHELL_TESTS: '1'
        run: cargo test --workspace --locked -- --nocapture
      - name: Diagnose Windows resource registration
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class ResourceProbe {
            [DllImport("rstrtmgr.dll", CharSet = CharSet.Unicode)]
            public static extern int RmStartSession(out uint handle, uint flags, StringBuilder key);
            [DllImport("rstrtmgr.dll", CharSet = CharSet.Unicode)]
            public static extern int RmRegisterResources(uint handle, uint count, string[] paths, uint apps, IntPtr processes, uint services, IntPtr names);
            [DllImport("rstrtmgr.dll")]
            public static extern int RmEndSession(uint handle);
            [DllImport("kernel32.dll", CharSet = CharSet.Unicode)]
            public static extern uint GetShortPathName(string path, StringBuilder output, uint length);
          }
          '@
          $base = Join-Path $env:TEMP ('hanamori-rm-probe-' + [guid]::NewGuid())
          foreach ($length in @(140, 200, 240, 260, 300)) {
            $path = Join-Path (Join-Path $base ('a' * ($length - $base.Length - 15))) 'resource.txt'
            [IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($path)) | Out-Null
            [IO.File]::WriteAllText($path, 'probe')
            $short = [Text.StringBuilder]::new(32768)
            $null = [ResourceProbe]::GetShortPathName(('\\?\' + $path), $short, 32768)
            foreach ($name in @($path, ('\\?\' + $path), $short.ToString())) {
              [uint32] $handle = 0
              $key = [Text.StringBuilder]::new(33)
              $start = [ResourceProbe]::RmStartSession([ref] $handle, 0, $key)
              $registered = [ResourceProbe]::RmRegisterResources($handle, 1, @($name), 0, [IntPtr]::Zero, 0, [IntPtr]::Zero)
              Write-Host "start=$start register=$registered length=$($name.Length) path=$name"
              $null = [ResourceProbe]::RmEndSession($handle)
            }
          }
          Remove-Item -LiteralPath $base -Recurse -Force
