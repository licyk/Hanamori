name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source:
        description: Commit to check
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ inputs.source || github.ref }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source || github.ref }}
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install Zsh for Linux shell integration tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check module architecture
        run: cargo xtask check
      - name: Test library and CLI
        env:
          HANAMORI_REQUIRE_SHELL_TESTS: '1'
        run: cargo test --workspace --locked ${{ runner.os == 'Windows' && '--release --target x86_64-pc-windows-msvc' || '' }} -- --nocapture
