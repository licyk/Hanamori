name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install Zsh for Linux shell integration tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check module architecture
        run: cargo xtask check
      - name: Test library and CLI
        env:
          HANAMORI_REQUIRE_SHELL_TESTS: '1'
        run: cargo test --workspace --locked
