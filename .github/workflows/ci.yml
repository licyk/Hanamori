name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/api/**'
      - 'tests/cli/**'
      - 'tests/fixtures/**'
      - 'test-support/**'
      - 'xtask/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'rustfmt.toml'
      - '.rustfmt.toml'
      - '.gitattributes'
      - '.github/scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/api/**'
      - 'tests/cli/**'
      - 'tests/fixtures/**'
      - 'test-support/**'
      - 'xtask/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'rustfmt.toml'
      - '.rustfmt.toml'
      - '.gitattributes'
      - '.github/scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      source:
        description: Commit to check
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ inputs.source || github.ref }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source || github.ref }}
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install Zsh for Linux shell integration tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check module architecture
        run: cargo xtask check
      - name: Test library and CLI
        env:
          HANAMORI_REQUIRE_SHELL_TESTS: '1'
        run: cargo test --workspace --locked ${{ matrix.target && format('--release --target {0}', matrix.target) || '' }} -- --nocapture
